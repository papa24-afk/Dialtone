<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#18132b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="880" height="240" rx="16" fill="none" stroke="#26283b" stroke-width="1.5" />

  <!-- Background Glow & Wave Elements -->
  <circle cx="760" cy="120" r="140" fill="url(#glowGrad)" filter="url(#glow)" />
  <path d="M 640 120 Q 690 60 740 120 T 840 120" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.25" />
  <path d="M 660 120 Q 710 80 760 120 T 860 120" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.2" />

  <!-- Brand Mark Icon -->
  <g transform="translate(48, 48)">
    <!-- Outer Glow Circle -->
    <rect width="72" height="72" rx="20" fill="url(#brandGrad)" filter="url(#glow)" opacity="0.3" />
    <!-- Main Icon Tile -->
    <rect width="72" height="72" rx="20" fill="url(#brandGrad)" />
    <!-- Cellular Wave Signal Glyph -->
    <path d="M 22 46 C 26 28 34 28 38 46 S 50 46 54 28" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="22" cy="46" r="2.5" fill="#ffffff" />
    <circle cx="54" cy="28" r="2.5" fill="#ffffff" />
  </g>

  <!-- Title & Headline -->
  <text x="140" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Dialtone</text>
  <text x="312" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a855f7" letter-spacing="1.5">v1.0.0 • OPEN SOURCE</text>

  <!-- Tagline -->
  <text x="140" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">Desktop Cellular Communication Suite for USB Modems on Windows</text>

  <!-- Feature Pills -->
  <g transform="translate(48, 154)">
    <!-- Pill 1: Voice Calling -->
    <rect x="0" y="0" width="168" height="34" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">📞 Voice Calls (8kHz PCM)</text>

    <!-- Pill 2: SMS Messaging -->
    <rect x="180" y="0" width="138" height="34" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="194" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">💬 SMS Messaging</text>

    <!-- Pill 3: USSD Terminal -->
    <rect x="330" y="0" width="146" height="34" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="344" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">⚡ Interactive USSD</text>

    <!-- Pill 4: Huawei Dongles -->
    <rect x="488" y="0" width="168" height="34" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="502" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">🔌 Huawei K4201 Dongles</text>

    <!-- Pill 5: Windows 10/11 -->
    <rect x="668" y="0" width="128" height="34" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="682" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">🪟 Windows 10 / 11</text>
  </g>
</svg>
