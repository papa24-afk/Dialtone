    // --- Helper Functions ---
    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return "Good Morning,";
      if (hour < 17) return "Good Afternoon,";
      return "Good Evening,";
    }

    function formatPhoneNumber(num) {
      if (!num) return "";
      const s = String(num).trim();
      if (/^0\d{9}$/.test(s)) {
        return `+233 ${s.slice(1, 3)} ${s.slice(3, 6)} ${s.slice(6)}`;
      }
      if (/^\+233\d{9}$/.test(s)) {
        return `+233 ${s.slice(4, 6)} ${s.slice(6, 9)} ${s.slice(9)}`;
      }
      return s;
    }

    function isPurePhoneNumber(str) {
      if (!str) return false;
      const cleaned = str.replace(/[\s\-\+\(\)]/g, "");
      return /^\d{3,}$/.test(cleaned);
    }

    function getInitials(name) {
      if (!name) return "";
      const trimmed = name.trim();
      if (isPurePhoneNumber(trimmed)) {
        return null;
      }
      const parts = trimmed.split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return trimmed.slice(0, 2).toUpperCase();
    }

    function formatDuration(sec) {
      if (!sec) return "0s";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return `${h}h ${m}m ${s}s`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

      // Dialer State
      const [dialNumber, setDialNumber] = useState("");
      const [callsLeftTab, setCallsLeftTab] = useState("contacts"); // "contacts" | "recents"

      // Call History State
      const [callHistory, setCallHistory] = useState([]);
      const [dashboardActivityTab, setDashboardActivityTab] = useState("calls"); // "calls" | "messages" | "ussd"

      // Messages State
      const [conversations, setConversations] = useState([]);
      const [selectedConvNumber, setSelectedConvNumber] = useState(null);
      const [messages, setMessages] = useState([]);
      const [msgDraft, setMsgDraft] = useState("");
      const [convSearch, setConvSearch] = useState("");
      const [showNewMsgModal, setShowNewMsgModal] = useState(false);
      const [newMsgTo, setNewMsgTo] = useState("");
      const [newMsgText, setNewMsgText] = useState("");
      const [isSendingMsg, setIsSendingMsg] = useState(false);
      const messagesEndRef = useRef(null);

      // USSD Interactive Menu Terminal State
      const [ussdInput, setUssdInput] = useState("");
      const [ussdReplyInput, setUssdReplyInput] = useState("");
      const [ussdSessionActive, setUssdSessionActive] = useState(false);
      const [ussdLoading, setUssdLoading] = useState(false);
      const [currentUssdMenu, setCurrentUssdMenu] = useState(null);
      const [ussdHistory, setUssdHistory] = useState([]);
      const [showUssdHistory, setShowUssdHistory] = useState(false);

      // Audio Diagnostics & Audio Test Meter State
      const [audioDiag, setAudioDiag] = useState(null);
      const [isAudioTesting, setIsAudioTesting] = useState(false);
      const [audioMeterLevel, setAudioMeterLevel] = useState(0);

      // SSE Connection & Auto-refresh
      useEffect(() => {
        fetchStatus();
        loadContacts();
        loadCallHistory();
        loadConversations();
        fetchUssdState();

        const es = new EventSource(`${API_BASE}/api/events`);
        
        const applyStatusUpdate = (raw) => {
          const s = raw.data || raw;
          setStatus(prev => ({ ...prev, ...s }));
          if (s.is_muted !== undefined) setIsMuted(s.is_muted);
          if (s.speaker_enabled !== undefined) setSpeakerEnabled(s.speaker_enabled);
          if (s.latest_ussd) {
            setCurrentUssdMenu(s.latest_ussd);
            setUssdSessionActive(s.latest_ussd.type === 1);
          }
        };

        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            applyStatusUpdate(data);
          } catch (err) {}
        };

        es.addEventListener("status_update", (e) => {
          try {
            const data = JSON.parse(e.data);
            applyStatusUpdate(data);
          } catch (err) {}
        });

        es.addEventListener("modem_connected", () => {
          fetchStatus();
        });

        es.addEventListener("modem_disconnected", () => {
          fetchStatus();
        });

        // 2-second heartbeat status polling ensures UI is never stuck
        const pollTimer = setInterval(fetchStatus, 2000);

        es.addEventListener("incoming_call", (e) => {
          const callData = JSON.parse(e.data).data;
          setIncomingCall(callData);
          loadCallHistory();
        });

        es.addEventListener("call_state", (e) => {
          const stateData = JSON.parse(e.data).data;
          setStatus(prev => ({
            ...prev,
            call_state: stateData.state,
            active_number: stateData.number || prev.active_number,
            contact_name: stateData.contact_name || prev.contact_name,
            caller_id: stateData.number || prev.caller_id
          }));
          if (stateData.state === "IDLE") {
            setIncomingCall(null);
            setInCallDtmfOpen(false);
          }
          loadCallHistory();
        });

        es.addEventListener("ussd_response", (e) => {
          const ussd = JSON.parse(e.data).data;
          setUssdLoading(false);
          setCurrentUssdMenu(ussd);
          setUssdSessionActive(ussd.type === 1);
          setUssdHistory(prev => [
            { text: ussd.text, type: ussd.type, time: ussd.time || new Date().toLocaleTimeString() },
            ...prev
          ]);
        });

        es.addEventListener("new_sms", () => {
          loadConversations();
          if (selectedConvNumber) {
            loadMessages(selectedConvNumber);
          }
        });

        es.addEventListener("sms_sent", () => {
          loadConversations();
          if (selectedConvNumber) {
            loadMessages(selectedConvNumber);
          }
        });

        return () => {
          es.close();
          clearInterval(pollTimer);
        };
      }, [selectedConvNumber]);

      // Call Duration Timer (ticks during dialing, ringing, and active calls)
      useEffect(() => {
        let interval = null;
        if (status.call_state === "CONNECTED" || status.call_state === "DIALING" || status.call_state === "RINGING") {
          interval = setInterval(() => {
            setCallDurationSec(prev => prev + 1);
          }, 1000);
        } else if (status.call_state === "IDLE") {
          setCallDurationSec(0);
        }
        return () => clearInterval(interval);
      }, [status.call_state]);

      // Diagnostics Polling
      useEffect(() => {
        let timer = null;
        if (currentNav === "audio" || status.call_state === "CONNECTED") {
          fetchAudioDiagnostics();
          timer = setInterval(fetchAudioDiagnostics, 1000);
        }
        return () => clearInterval(timer);
      }, [currentNav, status.call_state]);

      // Auto-scroll chat
      useEffect(() => {
        if (messagesEndRef.current) {
          messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
        }
      }, [messages]);

      // Audio Test Simulation (Level Meter)
      useEffect(() => {
        let timer = null;
        if (isAudioTesting) {
          timer = setInterval(() => {
            setAudioMeterLevel(Math.floor(Math.random() * 8) + 4);
          }, 100);
        } else {
          setAudioMeterLevel(0);
        }
        return () => clearInterval(timer);
      }, [isAudioTesting]);

      // --- API Helpers ---
      const fetchStatus = async () => {
        try {
          const r = await fetch(`${API_BASE}/api/status`);
          const data = await r.json();
          setStatus(prev => ({ ...prev, ...data }));
          setIsMuted(data.is_muted ?? false);
          setSpeakerEnabled(data.speaker_enabled ?? true);
        } catch (e) {}
      };

      const fetchUssdState = async () => {
        try {
          const r = await fetch(`${API_BASE}/api/ussd`);
          const data = await r.json();
          if (data.latest) {
            setCurrentUssdMenu(data.latest);
            setUssdSessionActive(data.latest.type === 1);
          }
        } catch (e) {}
      };

      const loadContacts = async (search = "") => {
        try {
          const r = await fetch(`${API_BASE}/api/contacts?search=${encodeURIComponent(search)}`);
          const data = await r.json();
          setContacts(data);
        } catch (e) {}
      };

      const loadCallHistory = async () => {
        try {
          const r = await fetch(`${API_BASE}/api/calls?filter=all`);
          const data = await r.json();
          setCallHistory(data);
        } catch (e) {}
      };

      const loadConversations = async (search = convSearch) => {
        try {
          const r = await fetch(`${API_BASE}/api/conversations?search=${encodeURIComponent(search)}`);
          const data = await r.json();
          setConversations(data);
          if (data.length > 0 && !selectedConvNumber) {
            setSelectedConvNumber(data[0].phone_number);
            loadMessages(data[0].phone_number);
          }
        } catch (e) {}
      };

      const loadMessages = async (number) => {
        if (!number) return;
        try {
          const r = await fetch(`${API_BASE}/api/messages?number=${encodeURIComponent(number)}`);
          const data = await r.json();
          setMessages(data);
          await fetch(`${API_BASE}/api/messages/read`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ number })
          });
        } catch (e) {}
      };

      const fetchAudioDiagnostics = async () => {
        try {
          const r = await fetch(`${API_BASE}/api/audio/diagnostics`);
          const data = await r.json();
          setAudioDiag(data);
        } catch (e) {}
      };

      // --- Call Actions ---
      const handleDial = async (numberToDial) => {
        const num = (numberToDial || dialNumber).trim();
        if (!num) return;
        if (num.startsWith("*") && num.endsWith("#")) {
          handleSendUssd(num);
          setCurrentNav("ussd");
          return;
        }
        try {
          await fetch(`${API_BASE}/api/dial`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ number: num })
          });
          setCurrentNav("calls");
        } catch (e) {}
      };

      const handleHangup = async () => {
        try {
          await fetch(`${API_BASE}/api/hangup`, { method: "POST" });
          setIncomingCall(null);
        } catch (e) {}
      };

      const handleAnswer = async () => {
        try {
          await fetch(`${API_BASE}/api/answer`, { method: "POST" });
          setIncomingCall(null);
          setCurrentNav("calls");
        } catch (e) {}
      };

      const handleToggleMute = async () => {
        const next = !isMuted;
        setIsMuted(next);
        try {
          await fetch(`${API_BASE}/api/audio/mute`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ muted: next })
          });
        } catch (e) {}
      };

      const handleToggleSpeaker = async () => {
        const next = !speakerEnabled;
        setSpeakerEnabled(next);
        try {
          await fetch(`${API_BASE}/api/audio/speaker`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ enabled: next })
          });
        } catch (e) {}
      };

      const handleHoldToggle = async () => {
        const isHeld = status.call_state === "HELD";
        const endpoint = isHeld ? "/api/resume" : "/api/hold";
        try {
          await fetch(`${API_BASE}${endpoint}`, { method: "POST" });
        } catch (e) {}
      };

      const handleSendDtmf = async (digit) => {
        try {
          await fetch(`${API_BASE}/api/dtmf`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ digit })
          });
        } catch (e) {}
      };

      // --- Contact Actions ---
      const handleSaveContact = async () => {
        if (!newContactName.trim() || !newContactPhone.trim()) return;
        try {
          await fetch(`${API_BASE}/api/contacts/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: newContactName.trim(),
              phone_number: newContactPhone.trim(),
              category: newContactCategory
            })
          });
          setNewContactName("");
          setNewContactPhone("");
          setShowAddContact(false);
          loadContacts();
          loadConversations();
        } catch (e) {}
      };

      const handleDeleteContact = async (id) => {
        try {
          await fetch(`${API_BASE}/api/contacts/delete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id })
          });
          loadContacts();
        } catch (e) {}
      };

      // --- Messaging Actions ---
      const handleSendMessage = async () => {
        if (!msgDraft.trim() || !selectedConvNumber || isSendingMsg) return;
        const text = msgDraft.trim();
        setMsgDraft("");
        setIsSendingMsg(true);
        try {
          await fetch(`${API_BASE}/api/sms/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ to: selectedConvNumber, text })
          });
          loadMessages(selectedConvNumber);
          loadConversations();
        } catch (e) {} finally {
          setIsSendingMsg(false);
        }
      };

      const handleSendNewMessage = async () => {
        if (!newMsgTo.trim() || !newMsgText.trim() || isSendingMsg) return;
        setIsSendingMsg(true);
        try {
          await fetch(`${API_BASE}/api/sms/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ to: newMsgTo.trim(), text: newMsgText.trim() })
          });
          const dest = newMsgTo.trim();
          setNewMsgTo("");
          setNewMsgText("");
          setShowNewMsgModal(false);
          setSelectedConvNumber(dest);
          loadMessages(dest);
          loadConversations();
        } catch (e) {} finally {
          setIsSendingMsg(false);
        }
      };

      const handleDeleteConversation = async (number) => {
        try {
          await fetch(`${API_BASE}/api/conversations/delete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ number })
          });
          setSelectedConvNumber(null);
          setMessages([]);
          loadConversations();
        } catch (e) {}
      };

      // --- USSD Interactive Actions ---
      const handleSendUssd = async (codeToSend) => {
        const code = (codeToSend || ussdInput).trim();
        if (!code) return;
        setUssdInput("");
        setUssdLoading(true);
        setCurrentUssdMenu({ text: "Requesting mobile network...", type: -1, time: new Date().toLocaleTimeString() });
        setTimeout(() => setUssdLoading(false), 5000);
        try {
          await fetch(`${API_BASE}/api/ussd`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code })
          });
        } catch (e) {
          setUssdLoading(false);
          setCurrentUssdMenu({ text: "Failed to connect to backend", type: 2, time: new Date().toLocaleTimeString() });
        }
      };

      const handleReplyUssd = async () => {
        if (!ussdReplyInput.trim()) return;
        const reply = ussdReplyInput.trim();
        setUssdReplyInput("");
        setUssdLoading(true);
        try {
          await fetch(`${API_BASE}/api/ussd`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: reply })
          });
        } catch (e) {
          setUssdLoading(false);
        }
      };

      const handleCancelUssd = async () => {
        try {
          await fetch(`${API_BASE}/api/ussd/cancel`, { method: "POST" });
          setUssdSessionActive(false);
          setCurrentUssdMenu({ text: "USSD Session cancelled.", type: 2, time: new Date().toLocaleTimeString() });
        } catch (e) {}
      };

      const handleTestAudioChime = () => {
        setIsAudioTesting(true);
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
        setTimeout(() => setIsAudioTesting(false), 2000);
      };

      const totalUnreadSMS = conversations.reduce((acc, c) => acc + (c.unread_count || 0), 0);
      const isCallActive = status.call_state === "CONNECTED" || status.call_state === "DIALING" || status.call_state === "RINGING" || status.call_state === "HELD";
      const selectedConv = conversations.find(c => c.phone_number === selectedConvNumber) || (selectedConvNumber ? { phone_number: selectedConvNumber, contact_name: null } : null);

      const filteredContacts = contacts.filter(c => {
        const matchesSearch = c.name.toLowerCase().includes(contactSearch.toLowerCase()) || c.phone_number.includes(contactSearch);
        if (selectedAlphaFilter === "ALL") return matchesSearch;
        return matchesSearch && c.name.toUpperCase().startsWith(selectedAlphaFilter);
      });

      // Operator initials for circle badge
      const operatorInitial = status.carrier.slice(0, 2).toUpperCase() || "OP";

      return (
        <div className="flex h-screen w-screen bg-surface-base text-slate-100 select-none overflow-hidden font-sans">
          
          {/* ============================================================== */}
          {/* LEFT NAVIGATION SIDEBAR (Dialtone Reference Design) */}
          {/* ============================================================== */}
          <aside className="w-56 bg-surface-rail border-r border-surface-border flex flex-col justify-between p-4 z-20 flex-shrink-0">
            <div>
              {/* Brand Header */}
              <div 
                onClick={() => setCurrentNav("home")}
                className="flex items-center gap-3 px-3 py-2 mb-6 cursor-pointer hover:opacity-90 transition-opacity"
              >
                <Icon.DialtoneLogo />
                <span className="text-lg font-bold text-white tracking-tight">Dialtone</span>
              </div>

              {/* Navigation Items */}
              <nav className="flex flex-col gap-1 w-full">
                <button 
                  onClick={() => setCurrentNav("home")}
                  className={`w-full px-3.5 py-2.5 rounded-2xl flex items-center gap-3 text-sm font-medium transition-all ${
                    currentNav === "home" 
                      ? "bg-brand-600/20 text-white border border-brand-500/30 shadow-md shadow-brand-600/10" 
                      : "text-slate-400 hover:text-slate-200 hover:bg-surface-hover/70"
                  }`}
                >
                  <Icon.Home />
                  <span>Home</span>
                </button>

                <button 
                  onClick={() => setCurrentNav("calls")}
                  className={`w-full px-3.5 py-2.5 rounded-2xl flex items-center justify-between text-sm font-medium transition-all ${
                    currentNav === "calls" 
                      ? "bg-brand-600/20 text-white border border-brand-500/30 shadow-md shadow-brand-600/10" 
                      : "text-slate-400 hover:text-slate-200 hover:bg-surface-hover/70"
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <Icon.Phone />
                    <span>Calls</span>
                  </div>
                  {isCallActive ? (
                    <span className="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-ping"></span>
                  ) : (
                    <span className="px-2 py-0.5 rounded-full bg-brand-600/40 text-brand-400 text-[10px] font-bold">2</span>
                  )}
                </button>

                <button 
                  onClick={() => setCurrentNav("messages")}
                  className={`w-full px-3.5 py-2.5 rounded-2xl flex items-center justify-between text-sm font-medium transition-all ${
                    currentNav === "messages" 
                      ? "bg-brand-600/20 text-white border border-brand-500/30 shadow-md shadow-brand-600/10" 
                      : "text-slate-400 hover:text-slate-200 hover:bg-surface-hover/70"
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <Icon.MessageSquare />
                    <span>Messages</span>
                  </div>
                  <span className="px-2 py-0.5 rounded-full bg-brand-600 text-white text-[10px] font-bold shadow-sm">
                    {totalUnreadSMS || 3}
                  </span>
                </button>

                <button 
                  onClick={() => setCurrentNav("ussd")}
                  className={`w-full px-3.5 py-2.5 rounded-2xl flex items-center justify-between text-sm font-medium transition-all ${
                    currentNav === "ussd" 
                      ? "bg-brand-600/20 text-white border border-brand-500/30 shadow-md shadow-brand-600/10" 
                      : "text-slate-400 hover:text-slate-200 hover:bg-surface-hover/70"
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <Icon.Code />
                    <span>USSD</span>
                  </div>
                  {ussdSessionActive && (
                    <span className="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>
                  )}
                </button>

                <button 
                  onClick={() => setCurrentNav("contacts")}
                  className={`w-full px-3.5 py-2.5 rounded-2xl flex items-center gap-3 text-sm font-medium transition-all ${
                    currentNav === "contacts" 
                      ? "bg-brand-600/20 text-white border border-brand-500/30 shadow-md shadow-brand-600/10" 
                      : "text-slate-400 hover:text-slate-200 hover:bg-surface-hover/70"
                  }`}
                >
                  <Icon.Users />
                  <span>Contacts</span>
                </button>

                <button 
                  onClick={() => setCurrentNav("devices")}
                  className={`w-full px-3.5 py-2.5 rounded-2xl flex items-center gap-3 text-sm font-medium transition-all ${
                    currentNav === "devices" 
                      ? "bg-brand-600/20 text-white border border-brand-500/30 shadow-md shadow-brand-600/10" 
                      : "text-slate-400 hover:text-slate-200 hover:bg-surface-hover/70"
                  }`}
                >
                  <Icon.Cpu />
                  <span>Devices</span>
                </button>

                <button 
                  onClick={() => setCurrentNav("audio")}
                  className={`w-full px-3.5 py-2.5 rounded-2xl flex items-center gap-3 text-sm font-medium transition-all ${
                    currentNav === "audio" 
                      ? "bg-brand-600/20 text-white border border-brand-500/30 shadow-md shadow-brand-600/10" 
                      : "text-slate-400 hover:text-slate-200 hover:bg-surface-hover/70"
                  }`}
                >
                  <Icon.Activity />
                  <span>Audio</span>
                </button>

                <button 
                  onClick={() => setCurrentNav("settings")}
                  className={`w-full px-3.5 py-2.5 rounded-2xl flex items-center gap-3 text-sm font-medium transition-all ${
                    currentNav === "settings" 
                      ? "bg-brand-600/20 text-white border border-brand-500/30 shadow-md shadow-brand-600/10" 
                      : "text-slate-400 hover:text-slate-200 hover:bg-surface-hover/70"
                  }`}
                >
                  <Icon.Settings />
                  <span>Settings</span>
                </button>
              </nav>
            </div>

            {/* Bottom Dialtone Promo/Brand Card (Reference Image Bottom Left) */}
            <div className="p-4 rounded-2xl bg-gradient-to-br from-brand-900/40 via-surface-panel to-surface-card border border-brand-500/20 shadow-lg relative overflow-hidden">
              <div className="w-8 h-8 rounded-xl bg-brand-600/30 flex items-center justify-center mb-2.5 text-brand-400">
                <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M3 15c3-6 6-6 9 0s6 6 9 0" />
                </svg>
              </div>
              <h4 className="text-xs font-bold text-white tracking-wide">Dialtone</h4>
              <p className="text-[10px] text-slate-400 mt-0.5 leading-relaxed">
                Your cellular network. One beautiful experience.
              </p>
              <span className="text-[9px] font-mono text-slate-500 mt-2 block">v1.0.0</span>
            </div>
          </aside>

          {/* ============================================================== */}
          {/* MAIN SHELL */}
          {/* ============================================================== */}
          <div className="flex-1 flex flex-col h-full overflow-hidden bg-surface-base">
            
            {/* Top Windows Compact Modem / Network Bar (Reference Image Header) */}
            <header className="h-14 bg-surface-rail/90 border-b border-surface-border px-6 flex items-center justify-between text-xs text-slate-300 flex-shrink-0 z-10 backdrop-blur-md">
              
              {/* Left Top Bar: Active Modem Pill & Operator Pill */}
              <div className="flex items-center gap-3">
                {/* Active Device Dropdown Pill */}
                <div 
                  onClick={() => setCurrentNav("devices")}
                  className={`flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-card border transition-all shadow-sm cursor-pointer ${
                    status.modem_connected !== false ? "border-surface-border hover:border-brand-500/40" : (status.mbim_mode ? "border-amber-500/40 bg-amber-950/20 hover:border-amber-400/60" : "border-surface-border/50")
                  }`}
                  title={status.mbim_mode ? "Huawei modem in Data Mode. Re-insert USB dongle to activate Voice & SMS." : ""}
                >
                  <span className={`w-2 h-2 rounded-full ${status.modem_connected !== false ? "bg-emerald-400 animate-pulse" : (status.mbim_mode ? "bg-amber-400 animate-pulse" : "bg-slate-500")}`}></span>
                  <span className={`font-semibold ${status.modem_connected !== false ? "text-slate-200" : (status.mbim_mode ? "text-amber-200" : "text-slate-400")}`}>
                    {status.model || "Searching for Modem..."}
                  </span>
                  <Icon.ChevronDown />
                </div>

                {/* Operator & Network Pill */}
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-card border border-surface-border">
                  <Icon.Signal />
                  <span className="font-semibold text-slate-200">
                    {status.carrier || "Cellular Disconnected"}

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("UI Error caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#090a10] text-slate-200 flex flex-col items-center justify-center p-8">
              <div className="max-w-md w-full p-6 rounded-2xl bg-[#121420] border border-[#232742] shadow-2xl text-center space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 mx-auto flex items-center justify-center">
                  <Icon.AlertCircle className="w-6 h-6" />
                </div>
                <h2 className="text-lg font-bold text-white">Application Refresh Required</h2>
                <p className="text-xs text-slate-400 leading-relaxed">
                  {this.state.error?.message || "An unexpected interface error occurred."}
                </p>
                <button
                  onClick={() => window.location.reload()}
                  className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition-all shadow-lg shadow-indigo-600/30"
                >
                  Reload Dialtone
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>,
      document.getElementById("root")
    );
  </script>
</body>
</html>
